name: دانلود کامل کانال تلگرام (PRO)

on:
  workflow_dispatch:
    inputs:
      channel_username:
        required: true
        type: string
      max_posts:
        required: false
        type: number
        default: 0
      split_size_mb:
        required: false
        type: number
        default: 88

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 checkout
        uses: actions/checkout@v4

      - name: 🐍 install
        run: |
          pip install telethon tqdm

      - name: 📦 download channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          CHANNEL: ${{ github.event.inputs.channel_username }}
          MAX_POSTS: ${{ github.event.inputs.max_posts }}
          SPLIT: ${{ github.event.inputs.split_size_mb }}

        run: |
          python3 << 'EOF'

          import os
          import re
          import math
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION = os.environ["SESSION_STRING"]

          CHANNEL = os.environ["CHANNEL"]
          MAX_POSTS = int(os.environ["MAX_POSTS"])
          SPLIT = int(os.environ["SPLIT"])

          def safe(n):
              return re.sub(r'[\\/*?:"<>|]', "_", n)

          async def split_file(path, limit_mb):
              size = os.path.getsize(path)
              limit = limit_mb * 1024 * 1024

              if size <= limit:
                  return [path]

              parts = math.ceil(size / limit)
              out = []

              with open(path, "rb") as f:
                  for i in range(parts):
                      p = f"{path}.part{i+1:03d}"
                      out.append(p)

                      with open(p, "wb") as o:
                          left = limit
                          while left > 0:
                              chunk = f.read(min(left, 1024*1024))
                              if not chunk:
                                  break
                              o.write(chunk)
                              left -= len(chunk)

              os.remove(path)
              return out

          async def main():
              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH)

              await client.start()

              print("✅ connected")

              entity = await client.get_entity(CHANNEL)

              posts = []

              print("🔄 reading messages...")

              async for msg in client.iter_messages(entity, limit=MAX_POSTS or None):
                  if msg.file:
                      posts.append(msg)

              print("📦 files:", len(posts))

              os.makedirs("downloads", exist_ok=True)

              for i, msg in enumerate(posts, 1):

                  name = msg.file.name if msg.file and msg.file.name else str(msg.id)
                  name = safe(name)

                  path = f"downloads/{name}"

                  if os.path.exists(path):
                      print("skip", name)
                      continue

                  print(f"⬇️ {i}/{len(posts)} {name}")

                  p = await client.download_media(msg, path)

                  if p:
                      await split_file(p, SPLIT)

              await client.disconnect()

          asyncio.run(main())

          EOF

      - name: 📤 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add downloads/

          git pull --rebase || true

          git commit -m "telegram backup" || echo "no changes"

          git push
