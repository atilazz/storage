name: دانلود کل چنل

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Telegram channel'
        required: false
        type: string
        default: 'https://t.me/mychonel'

      limit:
        description: '0 = all posts'
        required: false
        type: number
        default: 0

      split_size:
        description: 'Split size MB (0=no split)'
        required: false
        type: number
        default: 90

      delete_after_download:
        description: 'Delete from channel after download? (true/false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          pip3 install telethon

      - name: Download Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.TG_SESSION }}

          CHANNEL: ${{ github.event.inputs.channel }}
          LIMIT: ${{ github.event.inputs.limit }}
          SPLIT_SIZE: ${{ github.event.inputs.split_size }}
          DELETE_AFTER: ${{ github.event.inputs.delete_after_download }}

        run: |

          python3 << 'EOF'

          import asyncio
          import os
          import re
          import time
          import math
          import hashlib

          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeFilename

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION = os.environ["SESSION"]

          CHANNEL = os.environ["CHANNEL"] or "https://t.me/mychonel"
          LIMIT = int(os.environ["LIMIT"])
          SPLIT_SIZE = int(os.environ["SPLIT_SIZE"])
          DELETE_AFTER = os.environ.get("DELETE_AFTER", "false").lower() == "true"

          DOWNLOAD_DIR = "dl"
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          split_lock = asyncio.Lock()
          downloaded_ids = set()

          # بارگذاری IDهای قبلی دانلود شده
          LOG_FILE = os.path.join(DOWNLOAD_DIR, ".downloaded_ids.txt")
          if os.path.exists(LOG_FILE):
              with open(LOG_FILE, "r") as f:
                  downloaded_ids = set(line.strip() for line in f)

          def safe(name):
              # جایگزینی کاراکترهای غیرمجاز
              return re.sub(r'[\\/*?:"<>|]', "_", name)

          def get_filename(msg):
              """دریافت نام صحیح فایل از پیام تلگرام"""
              file_name = None
              
              # روش 1: بررسی msg.file.name
              if hasattr(msg, 'file') and msg.file and msg.file.name:
                  file_name = msg.file.name
              
              # روش 2: بررسی DocumentAttributeFilename
              if not file_name and msg.document:
                  for attr in msg.document.attributes:
                      if isinstance(attr, DocumentAttributeFilename) and attr.file_name:
                          file_name = attr.file_name
                          break
              
              # روش 3: بررسی message media
              if not file_name and hasattr(msg, 'media') and msg.media:
                  if hasattr(msg.media, 'document'):
                      for attr in msg.media.document.attributes:
                          if isinstance(attr, DocumentAttributeFilename) and attr.file_name:
                              file_name = attr.file_name
                              break
              
              # روش 4: ساخت نام بر اساس نوع فایل
              if not file_name:
                  if msg.video:
                      file_name = f"video_{msg.id}.mp4"
                  elif msg.audio:
                      # استخراج نام آهنگ از فایل صوتی
                      if hasattr(msg.audio, 'title') and msg.audio.title:
                          file_name = f"{msg.audio.title}.mp3"
                      elif hasattr(msg.audio, 'performer') and msg.audio.performer:
                          file_name = f"{msg.audio.performer}.mp3"
                      else:
                          file_name = f"audio_{msg.id}.mp3"
                  elif msg.document:
                      mime = msg.document.mime_type if msg.document else ""
                      if "pdf" in mime:
                          file_name = f"doc_{msg.id}.pdf"
                      elif "zip" in mime:
                          file_name = f"file_{msg.id}.zip"
                      else:
                          file_name = f"file_{msg.id}.bin"
                  else:
                      file_name = f"media_{msg.id}.bin"
              
              # حذف فاصله‌های اضافی و کاراکترهای خاص
              file_name = safe(file_name.strip())
              
              # حذف فاصله از ابتدا و انتها
              file_name = file_name.strip()
              
              # اگر اسم فایل پسوند ندارد، پسوند مناسب اضافه کن
              if '.' not in file_name:
                  if msg.video:
                      file_name += '.mp4'
                  elif msg.audio:
                      file_name += '.mp3'
              else:
                  # اطمینان از اینکه پسوند فایل صحیح است
                  ext = file_name.split('.')[-1].lower()
                  if ext not in ['mp4', 'mkv', 'mp3', 'jpg', 'png', 'pdf', 'zip', 'rar', 'txt', 'bin']:
                      if msg.video:
                          file_name = file_name.rsplit('.', 1)[0] + '.mp4'
                      elif msg.audio:
                          file_name = file_name.rsplit('.', 1)[0] + '.mp3'
              
              return file_name

          async def split_file(path):
              async with split_lock:
                  if not os.path.exists(path):
                      return False

                  if SPLIT_SIZE == 0:
                      return True

                  size = os.path.getsize(path)
                  limit = SPLIT_SIZE * 1024 * 1024

                  if size <= limit:
                      return True

                  total = math.ceil(size / limit)

                  with open(path, "rb") as f:
                      for i in range(total):
                          part = f"{path}.part{i+1:03d}"
                          with open(part, "wb") as out:
                              remaining = limit
                              while remaining > 0:
                                  chunk = f.read(min(1024*1024, remaining))
                                  if not chunk:
                                      break
                                  out.write(chunk)
                                  remaining -= len(chunk)

                  os.remove(path)
                  return True

          async def delete_from_channel(client, msg):
              if not DELETE_AFTER:
                  print(f"🔒 delete disabled, keeping post {msg.id}")
                  return
              
              try:
                  await client.delete_messages(msg.chat_id, msg.id)
                  print(f"🗑 deleted post {msg.id} from channel")
              except Exception as e:
                  print(f"⚠️ delete failed for {msg.id}: {e}")

          async def process_one(client, msg, i, total):
              if not msg.media:
                  return

              # بررسی دانلود قبلی
              if str(msg.id) in downloaded_ids:
                  print(f"⏭️ already downloaded: post {msg.id}")
                  return

              name = get_filename(msg)
              path = os.path.join(DOWNLOAD_DIR, name)

              # اگه فایل همین اسم وجود داشت، یه عدد بهش اضافه کن
              counter = 1
              original_path = path
              while os.path.exists(path):
                  name, ext = os.path.splitext(original_path)
                  path = f"{name}_{counter}{ext}"
                  counter += 1

              print(f"\n⬇️ [{i}/{total}] {name} (post {msg.id})")

              start = time.time()
              last = 0

              def progress(cur, total_size):
                  nonlocal last
                  if time.time() - last < 0.3:
                      return
                  last = time.time()

                  if total_size == 0:
                      return

                  percent = cur * 100 / total_size
                  speed = cur / (time.time() - start + 0.001) / 1024 / 1024

                  print(
                      f"\r📥 {name} | {percent:.1f}% | {speed:.2f}MB/s",
                      end="",
                      flush=True
                  )

              try:
                  await client.download_media(msg, file=path, progress_callback=progress)
                  print(f"\n✅ downloaded: {name}")

                  # ذخیره ID در لیست دانلود شده‌ها
                  downloaded_ids.add(str(msg.id))
                  with open(LOG_FILE, "a") as f:
                      f.write(f"{msg.id}\n")

                  await split_file(path)

                  # حذف از کانال (فقط اگه گزینه فعال باشه)
                  await delete_from_channel(client, msg)

              except Exception as e:
                  print(f"\n❌ error downloading {name}: {e}")

          async def main():
              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH)
              await client.start()

              print(f"✅ connected to Telegram")
              print(f"📁 download folder: {DOWNLOAD_DIR}")
              print(f"🗑 delete after download: {DELETE_AFTER}")

              entity = await client.get_entity(CHANNEL)

              messages = await client.get_messages(
                  entity,
                  limit=None if LIMIT == 0 else LIMIT
              )

              messages = [m for m in messages if m.media]
              total = len(messages)

              print(f"📦 {total} media posts found in channel")
              print(f"📝 already downloaded: {len(downloaded_ids)} posts")

              # فقط پیام‌های جدید
              new_messages = [m for m in messages if str(m.id) not in downloaded_ids]
              print(f"🆕 new posts to download: {len(new_messages)}")

              sem = asyncio.Semaphore(3)

              async def worker(msg, i):
                  async with sem:
                      await process_one(client, msg, i, len(new_messages))

              await asyncio.gather(*[
                  worker(msg, i+1)
                  for i, msg in enumerate(new_messages)
              ])

              await client.disconnect()
              print(f"\n🎉 DONE - {len(new_messages)} files saved in '{DOWNLOAD_DIR}' folder")

          asyncio.run(main())

          EOF

      - name: Commit and push to storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          if git diff --staged --quiet; then
            echo "✅ no new files to commit"
          else
            git commit -m "telegram backup to dl folder [skip ci]"
            git push origin main
            echo "✅ changes pushed"
          fi
