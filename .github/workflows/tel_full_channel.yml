name: دانلود کل چنل

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Telegram channel'
        required: false
        type: string
        default: 'https://t.me/mychonel'

      limit:
        description: '0 = all posts'
        required: false
        type: number
        default: 0

      split_size:
        description: 'Split size MB (0=no split)'
        required: false
        type: number
        default: 90

      delete_after_download:
        description: 'Delete from channel after successful upload? (true/false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          pip3 install telethon

      - name: Download Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.TG_SESSION }}
          CHANNEL: ${{ github.event.inputs.channel }}
          LIMIT: ${{ github.event.inputs.limit }}
          SPLIT_SIZE: ${{ github.event.inputs.split_size }}
          DELETE_AFTER: ${{ github.event.inputs.delete_after_download }}
        run: |

          python3 << 'EOF'

          import asyncio
          import os
          import re
          import time
          import math
          import hashlib

          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeFilename

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION = os.environ["SESSION"]

          CHANNEL = os.environ["CHANNEL"] or "https://t.me/mychonel"
          LIMIT = int(os.environ["LIMIT"])
          SPLIT_SIZE = int(os.environ["SPLIT_SIZE"])
          DELETE_AFTER = os.environ.get("DELETE_AFTER", "false").lower() == "true"

          DOWNLOAD_DIR = "dl"
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          split_lock = asyncio.Lock()
          successfully_downloaded = []

          def safe(name):
              return re.sub(r'[\\/*?:"<>|]', "_", name)

          def get_filename(msg):
              file_name = None

              if hasattr(msg, 'file') and msg.file and msg.file.name:
                  file_name = msg.file.name

              if not file_name and msg.document:
                  for attr in msg.document.attributes:
                      if isinstance(attr, DocumentAttributeFilename) and attr.file_name:
                          file_name = attr.file_name
                          break

              if not file_name:
                  if msg.video:
                      file_name = f"video_{msg.id}.mp4"
                  elif msg.audio:
                      if hasattr(msg.audio, 'title') and msg.audio.title:
                          file_name = f"{msg.audio.title}.mp3"
                      else:
                          file_name = f"audio_{msg.id}.mp3"
                  else:
                      file_name = f"file_{msg.id}.bin"

              return safe(file_name.strip())

          async def split_file(path):
              async with split_lock:
                  if not os.path.exists(path):
                      return False

                  if SPLIT_SIZE == 0:
                      return True

                  size = os.path.getsize(path)
                  limit = SPLIT_SIZE * 1024 * 1024

                  if size <= limit:
                      return True

                  total = math.ceil(size / limit)

                  with open(path, "rb") as f:
                      for i in range(total):
                          part = f"{path}.part{i+1:03d}"
                          with open(part, "wb") as out:
                              remaining = limit
                              while remaining > 0:
                                  chunk = f.read(min(1024*1024, remaining))
                                  if not chunk:
                                      break
                                  out.write(chunk)
                                  remaining -= len(chunk)

                  os.remove(path)
                  return True

          async def process_one(client, msg, i, total):
              if not msg.media:
                  return

              name = get_filename(msg)
              path = os.path.join(DOWNLOAD_DIR, name)

              counter = 1
              original_path = path
              while os.path.exists(path):
                  name, ext = os.path.splitext(original_path)
                  path = f"{name}_{counter}{ext}"
                  counter += 1

              print(f"\n⬇️ [{i}/{total}] {name} (post {msg.id})")

              start = time.time()
              last = 0

              def progress(cur, total_size):
                  nonlocal last
                  if time.time() - last < 0.3:
                      return
                  last = time.time()

                  if total_size == 0:
                      return

                  percent = cur * 100 / total_size
                  speed = cur / (time.time() - start + 0.001) / 1024 / 1024
                  print(f"\r📥 {name} | {percent:.1f}% | {speed:.2f}MB/s", end="", flush=True)

              try:
                  await client.download_media(msg, file=path, progress_callback=progress)
                  print(f"\n✅ downloaded: {name}")

                  await split_file(path)

                  successfully_downloaded.append({
                      "id": msg.id,
                      "chat_id": msg.chat_id,
                      "name": name
                  })
              except Exception as e:
                  print(f"\n❌ error downloading {name}: {e}")

          async def main():
              nonlocal successfully_downloaded

              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH)
              await client.start()

              print(f"✅ connected to Telegram")
              print(f"🗑 delete after successful upload: {DELETE_AFTER}")

              entity = await client.get_entity(CHANNEL)

              messages = await client.get_messages(
                  entity,
                  limit=None if LIMIT == 0 else LIMIT
              )

              messages = [m for m in messages if m.media]
              total = len(messages)
              print(f"📦 {total} media posts found")

              sem = asyncio.Semaphore(3)

              async def worker(msg, i):
                  async with sem:
                      await process_one(client, msg, i, total)

              await asyncio.gather(*[
                  worker(msg, i+1)
                  for i, msg in enumerate(messages)
              ])

              await client.disconnect()
              print(f"\n🎉 Download phase complete. Successfully downloaded: {len(successfully_downloaded)} files")

              # ذخیره ID پیام‌های موفق برای مرحله حذف
              if successfully_downloaded and DELETE_AFTER:
                  with open("successful_ids.txt", "w") as f:
                      for item in successfully_downloaded:
                          f.write(f"{item['id']}\n")
                  print(f"📝 Saved {len(successfully_downloaded)} IDs for deletion")

          asyncio.run(main())

          EOF

      - name: Commit and push to storage
        id: git_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "🔄 Fetching latest changes..."
          git fetch origin main

          git add dl/

          if git diff --staged --quiet; then
            echo "✅ no new files to commit"
            echo "push_success=true" >> $GITHUB_OUTPUT
          else
            echo "📦 New files found, committing..."
            git commit -m "telegram backup to dl folder [skip ci]"

            MAX_RETRIES=3
            RETRY_COUNT=0
            PUSH_SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$PUSH_SUCCESS" = false ]; do
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "🔄 Push attempt $RETRY_COUNT/$MAX_RETRIES..."

              if git push origin main; then
                echo "✅ Push successful!"
                PUSH_SUCCESS=true
                echo "push_success=true" >> $GITHUB_OUTPUT
              else
                echo "⚠️ Push failed, pulling latest changes..."
                git pull --rebase origin main
                sleep 2
              fi
            done

            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ Failed to push after $MAX_RETRIES attempts"
              echo "push_success=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

      - name: Delete from Telegram channel (only if push succeeded and delete option is true)
        if: github.event.inputs.delete_after_download == 'true' && steps.git_push.outputs.push_success == 'true'
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.TG_SESSION }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          python3 << 'EOF'
          import asyncio
          import os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def delete_successful():
              API_ID = int(os.environ["API_ID"])
              API_HASH = os.environ["API_HASH"]
              SESSION = os.environ["SESSION"]
              CHANNEL = os.environ["CHANNEL"]

              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH)
              await client.start()

              print("✅ connected to Telegram for deletion")

              if not os.path.exists("successful_ids.txt"):
                  print("⚠️ No successful_ids.txt file found")
                  return

              with open("successful_ids.txt", "r") as f:
                  ids = [int(line.strip()) for line in f if line.strip()]

              if not ids:
                  print("⚠️ No IDs to delete")
                  return

              print(f"🗑 Deleting {len(ids)} posts from channel...")
              entity = await client.get_entity(CHANNEL)

              deleted_count = 0
              for msg_id in ids:
                  try:
                      await client.delete_messages(entity, msg_id)
                      deleted_count += 1
                      print(f"   ✅ deleted post {msg_id}")
                  except Exception as e:
                      print(f"   ❌ failed to delete {msg_id}: {e}")

              print(f"🎉 Deleted {deleted_count} posts successfully")

              # حذف فایل IDs بعد از اتمام
              os.remove("successful_ids.txt")
              await client.disconnect()

          asyncio.run(delete_successful())
          EOF
        continue-on-error: true
