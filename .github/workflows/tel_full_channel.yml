name: دانلود کل چنل

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Telegram channel'
        required: false
        type: string
        default: 'https://t.me/mychonel'

      limit:
        description: '0 = all posts'
        required: false
        type: number
        default: 0

      split_size:
        description: 'Split size MB (0=no split)'
        required: false
        type: number
        default: 90

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          pip3 install telethon

      - name: Download Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.TG_SESSION }}

          CHANNEL: ${{ github.event.inputs.channel }}
          LIMIT: ${{ github.event.inputs.limit }}
          SPLIT_SIZE: ${{ github.event.inputs.split_size }}

          TARGET_USER: ${{ secrets.TARGET_USER }}
          TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}

        run: |

          python3 << 'EOF'

          import asyncio
          import os
          import re
          import time
          import math
          import shutil
          import subprocess
          import hashlib

          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeFilename

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION = os.environ["SESSION"]

          CHANNEL = os.environ["CHANNEL"] or "https://t.me/mychonel"
          LIMIT = int(os.environ["LIMIT"])
          SPLIT_SIZE = int(os.environ["SPLIT_SIZE"])

          TARGET_USER = os.environ["TARGET_USER"]
          TARGET_TOKEN = os.environ["TARGET_TOKEN"]
          TARGET_REPO = os.environ["TARGET_REPO"]

          os.makedirs("downloads", exist_ok=True)

          push_lock = asyncio.Lock()
          split_lock = asyncio.Lock()

          downloaded_count = 0
          last_push_success = True   # ✅ FIX ADD

          def safe(name):
              return re.sub(r'[\\/*?:"<>|]', "_", name)

          def short_hash(text):
              return hashlib.md5(text.encode()).hexdigest()[:6]

          def get_filename(msg, msg_id):

              base = None

              if hasattr(msg, "file") and msg.file and getattr(msg.file, "name", None):
                  base = msg.file.name

              if msg.document:
                  for attr in msg.document.attributes:
                      if isinstance(attr, DocumentAttributeFilename):
                          base = attr.file_name

              if msg.video:
                  ext = msg.file.ext if msg.file and msg.file.ext else ".mp4"
                  base = f"{msg_id}{ext}"

              if msg.audio:
                  ext = msg.file.ext if msg.file and msg.file.ext else ".mp3"
                  base = f"{msg_id}{ext}"

              if msg.file and not base:
                  ext = msg.file.ext if msg.file.ext else ".bin"
                  base = f"{msg_id}{ext}"

              if not base:
                  base = f"{msg_id}.bin"

              base = safe(base)

              if os.path.exists("downloads/" + base):
                  name, ext = os.path.splitext(base)
                  base = f"{name}_{short_hash(str(msg_id))}{ext}"

              return base

          async def split_file(path):

              async with split_lock:

                  if not os.path.exists(path):
                      return False

                  if SPLIT_SIZE == 0:
                      return True

                  size = os.path.getsize(path)
                  limit = SPLIT_SIZE * 1024 * 1024

                  if size <= limit:
                      return True

                  parts = []
                  total = math.ceil(size / limit)

                  with open(path, "rb") as f:

                      for i in range(total):

                          part = f"{path}.part{i+1:03d}"

                          with open(part, "wb") as out:
                              remaining = limit

                              while remaining > 0:
                                  chunk = f.read(min(1024*1024, remaining))
                                  if not chunk:
                                      break
                                  out.write(chunk)
                                  remaining -= len(chunk)

                          parts.append(part)

                  os.remove(path)
                  return True

          async def git_push():

              global last_push_success

              async with push_lock:

                  print("\n🚀 pushing...")

                  if os.path.exists("storage_repo"):
                      shutil.rmtree("storage_repo")

                  subprocess.run([
                      "git","clone","--depth=1",
                      f"https://{TARGET_USER}:{TARGET_TOKEN}@github.com/{TARGET_USER}/{TARGET_REPO}.git",
                      "storage_repo"
                  ], check=True)

                  os.makedirs("storage_repo/downloads", exist_ok=True)

                  subprocess.run("cp -r downloads/* storage_repo/downloads/ 2>/dev/null || true", shell=True)

                  os.chdir("storage_repo")

                  subprocess.run(["git","config","user.name","bot"])
                  subprocess.run(["git","config","user.email","bot@users.noreply.github.com"])

                  subprocess.run(["git","add","."])
                  subprocess.run(["git","commit","-m","auto"], check=False)

                  result = subprocess.run(["git","push","origin","main"], check=False)

                  os.chdir("..")

                  last_push_success = (result.returncode == 0)

                  print("✅ push done:", last_push_success)

          async def delete_from_channel(client, msg):
              try:
                  await client.delete_messages(msg.chat_id, msg.id)
                  print(f"🗑 deleted {msg.id}")
              except Exception as e:
                  print(f"⚠️ delete failed: {e}")

          async def process_one(client, msg, i, total):

              global downloaded_count

              if not msg.media:
                  return

              name = get_filename(msg, msg.id)
              path = f"downloads/{name}"

              if os.path.exists(path):
                  print(f"⏭️ skip {name}")
                  return

              print(f"\n⬇️ [{i}/{total}] {name}")

              start = time.time()
              last = 0

              def progress(cur, total_size):

                  nonlocal last

                  if time.time() - last < 0.3:
                      return

                  last = time.time()

                  if total_size == 0:
                      return

                  percent = cur * 100 / total_size
                  speed = cur / (time.time() - start + 0.001) / 1024 / 1024

                  print(
                      f"\r📥 {name} | {percent:.1f}% | {speed:.2f}MB/s",
                      end="",
                      flush=True
                  )

              try:

                  await client.download_media(msg, file=path, progress_callback=progress)

                  print("\n✅ downloaded")

                  ok = await split_file(path)

                  if ok:
                      downloaded_count += 1

                      if downloaded_count % 5 == 0:
                          await git_push()

                      # ✅ FIXED DELETE LOGIC
                      if last_push_success:
                          await delete_from_channel(client, msg)
                      else:
                          print("⚠️ skip delete (push failed)")

              except Exception as e:
                  print(f"\n❌ error {e}")

          async def main():

              client = TelegramClient(
                  StringSession(SESSION),
                  API_ID,
                  API_HASH
              )

              await client.start()

              entity = await client.get_entity(CHANNEL)

              messages = await client.get_messages(
                  entity,
                  limit=None if LIMIT == 0 else LIMIT
              )

              messages = [m for m in messages if m.media]

              total = len(messages)

              print(f"📦 {total} media posts")

              sem = asyncio.Semaphore(3)

              async def worker(msg, i):
                  async with sem:
                      await process_one(client, msg, i, total)

              await asyncio.gather(*[
                  worker(msg, i+1)
                  for i, msg in enumerate(reversed(messages))
              ])

              await client.disconnect()
              await git_push()

              print("\n🎉 DONE")

          asyncio.run(main())

          EOF
