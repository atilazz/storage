name: دانلود کل چنل

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Telegram channel'
        required: false
        type: string
        default: 'https://t.me/mychonel'

      limit:
        description: '0 = all posts'
        required: false
        type: number
        default: 0

      split_size:
        description: 'Split size MB (0=no split)'
        required: false
        type: number
        default: 90

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          pip3 install telethon

      - name: Download Channel
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.TG_SESSION }}

          CHANNEL: ${{ github.event.inputs.channel }}
          LIMIT: ${{ github.event.inputs.limit }}
          SPLIT_SIZE: ${{ github.event.inputs.split_size }}

        run: |

          python3 << 'EOF'

          import asyncio
          import os
          import re
          import time
          import math
          import hashlib

          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeFilename

          API_ID = int(os.environ["API_ID"])
          API_HASH = os.environ["API_HASH"]
          SESSION = os.environ["SESSION"]

          CHANNEL = os.environ["CHANNEL"] or "https://t.me/mychonel"
          LIMIT = int(os.environ["LIMIT"])
          SPLIT_SIZE = int(os.environ["SPLIT_SIZE"])

          # استفاده از پوشه dl به جای downloads
          DOWNLOAD_DIR = "dl"
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          split_lock = asyncio.Lock()

          def safe(name):
              return re.sub(r'[\\/*?:"<>|]', "_", name)

          def short_hash(text):
              return hashlib.md5(text.encode()).hexdigest()[:6]

          def get_filename(msg, msg_id):
              base = None

              if hasattr(msg, "file") and msg.file and getattr(msg.file, "name", None):
                  base = msg.file.name

              if msg.document:
                  for attr in msg.document.attributes:
                      if isinstance(attr, DocumentAttributeFilename):
                          base = attr.file_name

              if msg.video:
                  ext = msg.file.ext if msg.file and msg.file.ext else ".mp4"
                  base = f"{msg_id}{ext}"

              if msg.audio:
                  ext = msg.file.ext if msg.file and msg.file.ext else ".mp3"
                  base = f"{msg_id}{ext}"

              if msg.file and not base:
                  ext = msg.file.ext if msg.file.ext else ".bin"
                  base = f"{msg_id}{ext}"

              if not base:
                  base = f"{msg_id}.bin"

              base = safe(base)

              # جلوگیری از نام تکراری
              full_path = os.path.join(DOWNLOAD_DIR, base)
              if os.path.exists(full_path):
                  name, ext = os.path.splitext(base)
                  base = f"{name}_{short_hash(str(msg_id))}{ext}"

              return base

          async def split_file(path):
              async with split_lock:
                  if not os.path.exists(path):
                      return False

                  if SPLIT_SIZE == 0:
                      return True

                  size = os.path.getsize(path)
                  limit = SPLIT_SIZE * 1024 * 1024

                  if size <= limit:
                      return True

                  total = math.ceil(size / limit)

                  with open(path, "rb") as f:
                      for i in range(total):
                          part = f"{path}.part{i+1:03d}"
                          with open(part, "wb") as out:
                              remaining = limit
                              while remaining > 0:
                                  chunk = f.read(min(1024*1024, remaining))
                                  if not chunk:
                                      break
                                  out.write(chunk)
                                  remaining -= len(chunk)

                  os.remove(path)
                  return True

          async def process_one(client, msg, i, total):
              if not msg.media:
                  return

              name = get_filename(msg, msg.id)
              path = os.path.join(DOWNLOAD_DIR, name)

              if os.path.exists(path):
                  print(f"⏭️ skip {name}")
                  return

              print(f"\n⬇️ [{i}/{total}] {name}")

              start = time.time()
              last = 0

              def progress(cur, total_size):
                  nonlocal last
                  if time.time() - last < 0.3:
                      return
                  last = time.time()

                  if total_size == 0:
                      return

                  percent = cur * 100 / total_size
                  speed = cur / (time.time() - start + 0.001) / 1024 / 1024

                  print(
                      f"\r📥 {name} | {percent:.1f}% | {speed:.2f}MB/s",
                      end="",
                      flush=True
                  )

              try:
                  await client.download_media(msg, file=path, progress_callback=progress)
                  print("\n✅ downloaded")

                  await split_file(path)

              except Exception as e:
                  print(f"\n❌ error {e}")

          async def main():
              client = TelegramClient(StringSession(SESSION), API_ID, API_HASH)
              await client.start()

              entity = await client.get_entity(CHANNEL)

              messages = await client.get_messages(
                  entity,
                  limit=None if LIMIT == 0 else LIMIT
              )

              messages = [m for m in messages if m.media]
              total = len(messages)

              print(f"📦 {total} media posts found")

              sem = asyncio.Semaphore(3)

              async def worker(msg, i):
                  async with sem:
                      await process_one(client, msg, i, total)

              await asyncio.gather(*[
                  worker(msg, i+1)
                  for i, msg in enumerate(reversed(messages))
              ])

              await client.disconnect()
              print("\n🎉 DONE - all files saved in 'dl' folder")

          asyncio.run(main())

          EOF

      - name: Commit and push to storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          if git diff --staged --quiet; then
            echo "✅ no new files to commit"
          else
            git commit -m "telegram backup to dl folder [skip ci]"
            git push origin main
            echo "✅ changes pushed"
          fi
