name: Download File from Direct Link

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'لینک مستقیم فایل (Direct Download URL)'
        required: true
        type: string
      filename:
        description: 'نام فایل خروجی (اختیاری - خالی بگذارید خودکار نامگذاری شود)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create dl folder
        run: mkdir -p dl

      - name: 🔍 Extract filename from URL (if not provided)
        id: filename
        run: |
          if [ -z "${{ github.event.inputs.filename }}" ]; then
            # استخراج نام فایل از لینک
            URL="${{ github.event.inputs.download_url }}"
            FILENAME=$(basename "$URL" | cut -d '?' -f1 | cut -d '#' -f1)
            # اگر نام فایل معتبر نبود، از timestamp استفاده کن
            if [[ -z "$FILENAME" || "$FILENAME" == "/" || "$FILENAME" == *"="* ]]; then
              FILENAME="downloaded_$(date +'%Y%m%d_%H%M%S').bin"
            fi
            echo "file_name=$FILENAME" >> $GITHUB_OUTPUT
          else
            echo "file_name=${{ github.event.inputs.filename }}" >> $GITHUB_OUTPUT
          fi

      - name: ⬇️ Download file
        run: |
          echo "📥 Downloading from: ${{ github.event.inputs.download_url }}"
          echo "📄 Saving as: dl/${{ steps.filename.outputs.file_name }}"
          curl -L --retry 3 --retry-delay 2 \
            -o "dl/${{ steps.filename.outputs.file_name }}" \
            "${{ github.event.inputs.download_url }}"

      - name: 📊 Show file info
        run: |
          FILE="dl/${{ steps.filename.outputs.file_name }}"
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE" 2>/dev/null)
            echo "✅ فایل دانلود شد: ${{ steps.filename.outputs.file_name }}"
            echo "📦 حجم: $((SIZE / 1024 / 1024)) MB"
          else
            echo "❌ فایل دانلود نشد!"
            exit 1
          fi

      - name: 📤 Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Add downloaded file: ${{ steps.filename.outputs.file_name }} [skip ci]" || echo "No changes to commit"
          git push
