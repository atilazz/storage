name: Download File from Direct Link

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'لینک مستقیم فایل (Direct Download URL)'
        required: true
        type: string
      filename:
        description: 'نام فایل خروجی (اختیاری - خالی بگذارید خودکار نامگذاری شود)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📁 Create dl folder
        run: mkdir -p dl

      - name: 🔍 Extract filename from URL (if not provided)
        id: filename
        run: |
          if [ -z "${{ github.event.inputs.filename }}" ]; then
            # استخراج نام فایل از لینک
            URL="${{ github.event.inputs.download_url }}"
            FILENAME=$(basename "$URL" | cut -d '?' -f1 | cut -d '#' -f1)
            # اگر نام فایل معتبر نبود، از timestamp استفاده کن
            if [[ -z "$FILENAME" || "$FILENAME" == "/" || "$FILENAME" == *"="* ]]; then
              FILENAME="downloaded_$(date +'%Y%m%d_%H%M%S').bin"
            fi
            echo "file_name=$FILENAME" >> $GITHUB_OUTPUT
          else
            echo "file_name=${{ github.event.inputs.filename }}" >> $GITHUB_OUTPUT
          fi

      - name: ⬇️ Download file
        run: |
          echo "📥 Downloading from: ${{ github.event.inputs.download_url }}"
          echo "📄 Saving as: dl/${{ steps.filename.outputs.file_name }}"
          curl -L --retry 3 --retry-delay 2 \
            -o "dl/${{ steps.filename.outputs.file_name }}" \
            "${{ github.event.inputs.download_url }}"

      - name: 📊 Check file size and split if needed
        id: split
        run: |
          FILE="dl/${{ steps.filename.outputs.file_name }}"
          SPLIT_SIZE=90  # حداکثر حجم هر قسمت (مگابایت)
          
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE" 2>/dev/null)
            SIZE_MB=$((SIZE / 1024 / 1024))
            LIMIT_BYTES=$((SPLIT_SIZE * 1024 * 1024))
            
            echo "📦 حجم فایل اصلی: ${SIZE_MB} MB"
            
            if [ $SIZE -gt $LIMIT_BYTES ]; then
              echo "⚠️ فایل بزرگتر از ${SPLIT_SIZE} MB است، تقسیم می‌شود..."
              
              # تقسیم فایل به قسمت‌های SPLIT_SIZE مگابایتی
              cd dl
              split -b ${SPLIT_SIZE}M "${{ steps.filename.outputs.file_name }}" "${{ steps.filename.outputs.file_name }}.part."
              
              # حذف فایل اصلی
              rm "${{ steps.filename.outputs.file_name }}"
              
              # شمارش تعداد قسمت‌ها
              PART_COUNT=$(ls -1 "${{ steps.filename.outputs.file_name }}.part."* 2>/dev/null | wc -l)
              echo "✅ فایل به ${PART_COUNT} قسمت ${SPLIT_SIZE} مگابایتی تقسیم شد"
              echo "split_done=true" >> $GITHUB_OUTPUT
              cd ..
            else
              echo "✅ فایل کوچکتر از ${SPLIT_SIZE} MB است، بدون تغییر می‌ماند"
              echo "split_done=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ فایل یافت نشد!"
            exit 1
          fi

      - name: 📊 Show file info
        run: |
          echo "📁 محتویات پوشه dl:"
          ls -lh dl/
          
          TOTAL_SIZE=$(du -sh dl/ | cut -f1)
          FILE_COUNT=$(ls -1 dl/ | wc -l)
          echo "📦 مجموع حجم: ${TOTAL_SIZE}"
          echo "📄 تعداد فایل‌ها: ${FILE_COUNT}"

      - name: 📤 Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Add downloaded file: ${{ steps.filename.outputs.file_name }} [skip ci]" || echo "No changes to commit"
          git push
