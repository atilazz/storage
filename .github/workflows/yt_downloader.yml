name: youtube-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          YouTube URL(s). One per line. Optional per-URL mode:
          v 1080, v 1440, v 2160, a 320, etc.
        required: true
        type: string

      output_format:
        description: "Default output format"
        required: false
        type: choice
        options:
          - mp4
          - mp3
          - best
        default: mp4

      video_quality:
        description: "Maximum video resolution"
        required: false
        type: choice
        options:
          - "4320"
          - "2160"
          - "1440"
          - "1080"
          - "720"
          - "480"
          - "360"
          - "best"
        default: "1080"

      audio_quality:
        description: "MP3 bitrate"
        required: false
        type: choice
        options:
          - "320"
          - "192"
          - "128"
          - "64"
        default: "320"

      codec:
        description: "Preferred codec"
        required: false
        type: choice
        options:
          - any
          - h264
          - vp9
          - av1
        default: h264

      playlist_items:
        description: "Optional playlist selection, e.g. 1,3,5 or 3-7"
        required: false
        type: string
        default: ""

      sponsorblock:
        description: "Remove SponsorBlock categories"
        required: false
        type: boolean
        default: false

      embed_chapters:
        description: "Embed chapters"
        required: false
        type: boolean
        default: false

      write_description:
        description: "Save description"
        required: false
        type: boolean
        default: false

      download_subtitles:
        description: "Download subtitles"
        required: false
        type: boolean
        default: false

      subtitle_langs:
        description: "Subtitle languages, e.g. en,fa"
        required: false
        type: string
        default: "en"

      embed_metadata:
        description: "Embed metadata and thumbnail"
        required: false
        type: boolean
        default: false

      trim_start:
        description: "Start time, e.g. 0:33 or 1:22:10"
        required: false
        type: string
        default: ""

      trim_end:
        description: "End time, e.g. 1:22 or 2:00:00"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 700

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # IMPORTANT:
      # Put the CONTENTS of your local yt_coocki.txt into:
      # GitHub -> Settings -> Secrets and variables -> Actions
      # New repository secret -> YOUTUBE_COOKIES
      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -e
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > youtube-cookies.txt
            chmod 600 youtube-cookies.txt
            echo "✅ YouTube cookies loaded."
          else
            echo "⚠️ YOUTUBE_COOKIES secret is not configured."
            echo "   yt-dlp will try without cookies."
          fi

      - name: Install tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq python3 python3-pip

          python3 -m pip install --upgrade --quiet yt-dlp

          # yt-dlp's current JS challenge support
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

          echo "yt-dlp: $(yt-dlp --version)"
          echo "ffmpeg: $(ffmpeg -version | head -1)"
          echo "deno: $(deno --version | head -1)"

      - name: Parse input
        id: parse
        env:
          INPUT_URLS: ${{ inputs.url }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os, re, json

          raw = os.environ["INPUT_URLS"]
          raw = raw.replace(",", "\n")

          entries = []
          for line in raw.splitlines():
              line = line.strip()
              if not line:
                  continue

              # Expected:
              # URL
              # URL v 1080
              # URL a 320
              parts = line.split()
              url = None
              args = []

              for p in parts:
                  if re.match(r'^https?://', p):
                      if url is None:
                          url = p
                      else:
                          # A second URL starts another entry.
                          entries.append({"link": url, "args": args})
                          url = p
                          args = []
                  else:
                      if url is not None:
                          args.append(p)

              if url:
                  entries.append({"link": url, "args": args})

          # Keep only YouTube URLs.
          entries = [
              x for x in entries
              if re.search(r'(youtube\.com|youtu\.be)', x["link"], re.I)
          ]

          print("Parsed entries:")
          for x in entries:
              print(" -", x)

          with open("entries.json", "w", encoding="utf-8") as f:
              json.dump(entries, f, ensure_ascii=False)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("entries_file=entries.json\n")
              f.write(f"count={len(entries)}\n")
          PY

      - name: Download
        env:
          GLOBAL_FORMAT: ${{ inputs.output_format }}
          GLOBAL_VQ: ${{ inputs.video_quality }}
          GLOBAL_AQ: ${{ inputs.audio_quality }}
          GLOBAL_CODEC: ${{ inputs.codec }}
          PLAYLIST_ITEMS: ${{ inputs.playlist_items }}
          SPONSORBLOCK: ${{ inputs.sponsorblock }}
          EMBED_CHAPTERS: ${{ inputs.embed_chapters }}
          WRITE_DESCRIPTION: ${{ inputs.write_description }}
          DOWNLOAD_SUBTITLES: ${{ inputs.download_subtitles }}
          SUBTITLE_LANGS: ${{ inputs.subtitle_langs }}
          EMBED_METADATA: ${{ inputs.embed_metadata }}
          TRIM_START: ${{ inputs.trim_start }}
          TRIM_END: ${{ inputs.trim_end }}
        run: |
          set -uo pipefail

          mkdir -p youtube

          # Use an array instead of a string so quoting is always correct.
          COOKIE_ARGS=()
          if [ -s youtube-cookies.txt ]; then
            COOKIE_ARGS=(--cookies youtube-cookies.txt)
          fi

          COMMON_ARGS=(
            --no-abort-on-error
            --retries 10
            --fragment-retries 10
            --file-access-retries 5
            --extractor-retries 5
            --retry-sleep "exp=1:20"
            --js-runtimes "deno"
            --remote-components "ejs:npm"
            --newline
            --no-overwrites
            --continue
            --restrict-filenames
          )

          if [ "$PLAYLIST_ITEMS" != "" ]; then
            COMMON_ARGS+=(--playlist-items "$PLAYLIST_ITEMS")
          else
            COMMON_ARGS+=(--no-playlist)
          fi

          if [ "$SPONSORBLOCK" = "true" ]; then
            COMMON_ARGS+=(--sponsorblock-remove all)
          fi

          if [ "$EMBED_CHAPTERS" = "true" ]; then
            COMMON_ARGS+=(--embed-chapters)
          fi

          if [ "$WRITE_DESCRIPTION" = "true" ]; then
            COMMON_ARGS+=(--write-description)
          fi

          if [ "$DOWNLOAD_SUBTITLES" = "true" ]; then
            COMMON_ARGS+=(
              --write-subs
              --sub-langs "$SUBTITLE_LANGS"
              --sub-format "best"
            )
          fi

          if [ "$EMBED_METADATA" = "true" ]; then
            COMMON_ARGS+=(--embed-metadata --embed-thumbnail)
          fi

          if [ -n "$TRIM_START" ] || [ -n "$TRIM_END" ]; then
            START="${TRIM_START:-0}"
            END="${TRIM_END:-inf}"
            COMMON_ARGS+=(--download-sections "*${START}-${END}" --force-keyframes-at-cuts)
          fi

          build_video_format() {
            local max="$1"

            case "$GLOBAL_CODEC" in
              h264)
                echo "bv[height<=${max}][vcodec^=avc1]+ba/bv[height<=${max}][vcodec^=avc1]/bv[height<=${max}]+ba/b"
                ;;
              vp9)
                echo "bv[height<=${max}][vcodec^=vp9]+ba/bv[height<=${max}][vcodec*=vp9]+ba/b"
                ;;
              av1)
                echo "bv[height<=${max}][vcodec^=av01]+ba/bv[height<=${max}][vcodec*=av01]+ba/b"
                ;;
              *)
                echo "bv[height<=${max}]+ba/b"
                ;;
            esac
          }

          download_one() {
            local url="$1"
            local type="$2"
            local value="$3"

            echo
            echo "=================================================="
            echo "🎬 $url"
            echo "   Mode: $type"
            echo "   Quality: $value"
            echo "=================================================="

            if [ "$type" = "a" ]; then
              echo "🎵 Audio"

              yt-dlp \
                "${COOKIE_ARGS[@]}" \
                "${COMMON_ARGS[@]}" \
                -f "ba/b" \
                -x --audio-format mp3 \
                --audio-quality "${value}K" \
                -o "youtube/%(title)s-${value}kbps.%(ext)s" \
                "$url"
            else
              local fmt
              if [ "$value" = "best" ]; then
                fmt="bv+ba/b"
              else
                fmt="$(build_video_format "$value")"
              fi

              echo "📹 Format: $fmt"

              yt-dlp \
                "${COOKIE_ARGS[@]}" \
                "${COMMON_ARGS[@]}" \
                -f "$fmt" \
                --merge-output-format mp4 \
                -o "youtube/%(title)s-${value}p.%(ext)s" \
                "$url"
            fi
          }

          FAILED=0

          while IFS= read -r row; do
            link=$(echo "$row" | jq -r '.link')
            arg_count=$(echo "$row" | jq '.args | length')

            type=""
            value=""

            if [ "$arg_count" -ge 2 ]; then
              first=$(echo "$row" | jq -r '.args[0]')
              second=$(echo "$row" | jq -r '.args[1]')

              if [ "$first" = "v" ] || [ "$first" = "a" ]; then
                type="$first"
                value="$second"
              fi
            fi

            if [ -z "$type" ]; then
              if [ "$GLOBAL_FORMAT" = "mp3" ]; then
                type="a"
                value="$GLOBAL_AQ"
              elif [ "$GLOBAL_FORMAT" = "best" ]; then
                type="v"
                value="best"
              else
                type="v"
                value="$GLOBAL_VQ"
              fi
            fi

            if ! download_one "$link" "$type" "$value"; then
              echo "❌ Failed: $link"
              FAILED=$((FAILED + 1))
            else
              echo "✅ Success: $link"
            fi
          done < <(jq -c '.[]' entries.json)

          echo
          echo "=============================================="
          echo "Downloads finished. Failed: $FAILED"
          echo "=============================================="

          # Don't silently continue with an empty output folder.
          if ! find youtube -type f -print -quit | grep -q .; then
            echo "❌ No downloaded files found."
            exit 1
          fi

          # A failed URL should fail the workflow only after all URLs were attempted.
          if [ "$FAILED" -gt 0 ]; then
            echo "⚠️ Some URLs failed."
            exit 1
          fi

      - name: Verify and split large files
        run: |
          set -euo pipefail

          THRESH_MB=99
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))

          find youtube -maxdepth 1 -type f -print0 |
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")

            if [ "$size" -gt "$THRESH_BYTES" ]; then
              echo "✂️ Splitting: $(basename "$f")"

              # zip split is safe for arbitrary files and produces <=99MB chunks.
              zip -j -s "${THRESH_MB}m" "${f}.zip" "$f"
              rm -f "$f"
            fi
          done

          echo "📂 Final files:"
          find youtube -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Commit and push
        run: |
          set -euo pipefail

          if [ -z "$(find youtube -maxdepth 1 -type f -print -quit)" ]; then
            echo "❌ Nothing to commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add youtube/

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit."
            exit 0
          fi

          git commit -m "⬇️ YouTube download [skip ci]"

          for i in 1 2 3 4 5; do
            echo "🚀 Push attempt $i..."
            if git pull --rebase --autostash origin "${{ github.ref_name }}" &&
               git push origin "${{ github.ref_name }}"; then
              echo "✅ Push succeeded."
              exit 0
            fi

            echo "⏳ Push failed; retrying..."
            sleep 3
          done

          echo "❌ Push failed after 5 attempts."
          exit 1

      - name: Cleanup
        if: always()
        run: |
          rm -f youtube-cookies.txt entries.json
          echo "🧹 Cleanup complete."
