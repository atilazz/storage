name: youtube-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more YouTube URLs. Each can be followed by optional “v”/“a” and a quality value
          (e.g. “v 480” or “a 192”). Separate entries with newlines, commas, or spaces.
        required: true
        type: string
      output_format:
        description: 'Output format (applied when no per‑URL “v”/“a” is given)'
        required: false
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
          - best (auto)
        default: 'mp4 (video)'
      video_quality:
        description: 'Max video resolution (1080p default)'
        required: false
        type: choice
        options:
          - '4320 (8K)'
          - '2160 (4K)'
          - '1440 (2K)'
          - '1080 (Full HD)'
          - '720 (HD)'
          - '480'
          - '360'
          - 'best'
        default: '1080 (Full HD)'
      audio_quality:
        description: 'Audio bitrate for MP3 downloads'
        required: false
        type: choice
        options:
          - '320'
          - '192'
          - '128'
          - '64'
        default: '320'
      codec:
        description: 'Preferred video codec (ignored for audio‑only)'
        required: false
        type: choice
        options:
          - 'any (auto)'
          - 'h264 (MP4 compatible)'
          - 'vp9'
          - 'av1'
        default: 'h264 (MP4 compatible)'
      playlist_items:
        description: 'Playlist items (all, 3-7, 1,3,5, …). Leave empty for single video.'
        required: false
        type: string
      sponsorblock:
        description: 'Skip sponsor/intro/outro segments via SponsorBlock'
        required: false
        type: boolean
        default: false
      embed_chapters:
        description: 'Embed chapter markers in the output file'
        required: false
        type: boolean
        default: false
      write_description:
        description: 'Save video description as a .description file'
        required: false
        type: boolean
        default: false
      download_subtitles:
        description: 'Download subtitle files'
        required: false
        type: boolean
        default: false
      subtitle_langs:
        description: 'Subtitle languages (comma‑separated, e.g. en,fa)'
        required: false
        type: string
        default: 'en'
      embed_metadata:
        description: 'Embed thumbnail and metadata in the output file'
        required: false
        type: boolean
        default: false
      trim_start:
        description: 'Trim start timestamp (e.g. 0:33 or 1:22:10) – leave empty to skip'
        required: false
        type: string
      trim_end:
        description: 'Trim end timestamp (e.g. 1:22 or 2:00:00) – leave empty to skip'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 700
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ── Cookies (secret only) ──
      - name: '🍪 Prepare cookies'
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube-cookies.txt
            echo "✅ YouTube cookies written from secret."
          else
            echo "ℹ️ No YOUTUBE_COOKIES secret – proceeding without cookies."
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      # ── Parse URLs & per‑URL arguments ──
      - name: '📝 Parse all URLs and per‑URL arguments'
        id: parse
        run: |
          INPUT="${{ github.event.inputs.url }}"
          MODIFIED=$(echo "$INPUT" | tr ',' '\n')
          ENTRIES='[]'
          while IFS= read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue
            tokens=($line)
            i=0
            while [ $i -lt ${#tokens[@]} ]; do
              token="${tokens[$i]}"
              if [[ "$token" =~ ^https?:// ]]; then
                link="$token"
                args=()
                i=$((i+1))
                while [ $i -lt ${#tokens[@]} ]; do
                  next="${tokens[$i]}"
                  [[ "$next" =~ ^https?:// ]] && break
                  args+=("$next")
                  i=$((i+1))
                done
                args_json=$(printf '%s\n' "${args[@]}" | jq -R . | jq -s .)
                entry=$(jq -n --arg link "$link" --argjson args "$args_json" '{link: $link, args: $args}')
                ENTRIES=$(echo "$ENTRIES" | jq ". + [$entry]")
              else
                i=$((i+1))
              fi
            done
          done <<< "$MODIFIED"
          ENTRIES_JSON=$(echo "$ENTRIES" | jq -c .)
          echo "ENTRIES_JSON=$ENTRIES_JSON" >> $GITHUB_OUTPUT
          IS_ANY_YT=$(echo "$ENTRIES" | jq '[.[].link | test("youtube\\.com/watch\\?v=|youtu\\.be/")] | any')
          echo "IS_ANY_YT=$IS_ANY_YT" >> $GITHUB_OUTPUT
          echo "✅ Parsed $(echo "$ENTRIES" | jq length) entries, any YouTube? $IS_ANY_YT"

      # ── Prepare PATH ──
      - name: '📁 Prepare tool paths'
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          echo "✅ Tool paths prepared."

      # ── Install tools ──
      - name: '🛠️ Install download tools'
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          echo "📥 Installing / updating yt-dlp..."
          if ! command -v yt-dlp &> /dev/null; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
            chmod a+rx ~/.local/bin/yt-dlp
          fi
          echo "✅ yt-dlp ready."

          echo "📥 Installing jq, ffmpeg..."
          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi
          echo "✅ jq & ffmpeg ready."

          echo "📥 Installing Deno..."
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
          fi
          echo "✅ Deno ready."

          echo "📥 Installing additional fallback dependencies..."
          sudo apt-get install -y -qq python3-pip
          pip3 install --quiet pytube youtube-dl requests
          sudo curl -L https://yt-dl.org/downloads/latest/youtube-dl -o /usr/local/bin/youtube-dl
          sudo chmod a+rx /usr/local/bin/youtube-dl
          echo "✅ Fallback tools installed."

          echo "🔑 Installing PO Token provider plugin..."
          pip3 install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          echo "✅ PO Token provider plugin installed."

      # ── Build & Start PO Token Server ──
      - name: '🔧 Build PO Token server'
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          echo "📥 Cloning bgutil-ytdlp-pot-provider server..."
          git clone --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            /tmp/bgutil
          cd /tmp/bgutil/server
          echo "📦 Installing server dependencies..."
          npm ci
          npx tsc
          echo "✅ PO Token server built."

      - name: '🚀 Start PO Token server'
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          echo "🚀 Starting PO Token provider server on port 4416..."
          node /tmp/bgutil/server/build/main.js &
          sleep 5
          if pgrep -f "main.js" > /dev/null; then
            echo "✅ PO Token server is running."
          else
            echo "⚠️ PO Token server may not have started. Continuing without it."
          fi

      # ── Primary download (with 1080p default and 2K support) ──
      - name: '⬇️ Primary download'
        id: primary_download
        run: |
          set -e
          ENTRIES_JSON='${{ steps.parse.outputs.ENTRIES_JSON }}'
          OUTPUT_FOLDER="dl"
          mkdir -p "$OUTPUT_FOLDER"
          
          # Global defaults from the workflow inputs (video quality default is now 1080)
          GLOBAL_FORMAT="${{ github.event.inputs.output_format }}"
          GLOBAL_VQ="${{ github.event.inputs.video_quality }}"
          GLOBAL_AQ="${{ github.event.inputs.audio_quality }}"
          
          # Extract numeric part - works for 1440, 1080, 720, etc.
          GLOBAL_VQ_NUM=$(echo "$GLOBAL_VQ" | grep -oE '[0-9]+' | head -1)
          GLOBAL_AQ_NUM=$(echo "$GLOBAL_AQ" | grep -o '[0-9]*' | head -1)
          
          # Default to 1080 if parsing failed
          if [ -z "$GLOBAL_VQ_NUM" ]; then
            GLOBAL_VQ_NUM="1080"
          fi
          
          # Derive the default type/value
          if [ "$GLOBAL_FORMAT" = "mp3 (audio only)" ]; then
            GLOBAL_TYPE="a"
            GLOBAL_VAL="$GLOBAL_AQ_NUM"
          else
            GLOBAL_TYPE="v"
            GLOBAL_VAL="$GLOBAL_VQ_NUM"
          fi
          
          echo "🔧 Global defaults: type=$GLOBAL_TYPE quality=$GLOBAL_VAL"
          COOKIE_ARGS=""
          [ -f youtube-cookies.txt ] && COOKIE_ARGS="--cookies youtube-cookies.txt"
          EXTRACTOR_ARGS="--extractor-args youtube:player_client=default,web_embedded"
          FAILED_ENTRIES='[]'
          count=$(echo "$ENTRIES_JSON" | jq length)
          
          for ((idx=0; idx<count; idx++)); do
            link=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].link")
            args=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].args[]" 2>/dev/null || true)
            type=""
            val=""
            if [ -n "$args" ]; then
              first=$(echo "$args" | head -1)
              if [ "$first" = "v" ] || [ "$first" = "a" ]; then
                type="$first"
                val=$(echo "$args" | head -2 | tail -1)
              fi
            fi
            if [ -z "$type" ]; then
              type="$GLOBAL_TYPE"
              val="$GLOBAL_VAL"
            fi
            echo "========================================"
            echo "🎬 Processing $((idx+1))/$count: $link"
            echo "   🏷️  Type: $type   Quality: $val"
            
            if [ "$type" = "a" ]; then
              echo "   🎵 Downloading audio (format: ba[format_note*=original]/ba)"
              if yt-dlp $COOKIE_ARGS $EXTRACTOR_ARGS \
                -f "ba[format_note*=original]/ba" \
                --js-runtimes deno --remote-components ejs:npm --no-progress \
                -o "$OUTPUT_FOLDER/%(title)s-${val}kbps.%(ext)s" "$link"; then
                echo "   ✅ Audio download success"
              else
                echo "   ❌ Primary download failed – queued for fallback"
                FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [{link: \"$link\", type: \"$type\", val: \"$val\"}]")
              fi
            else
              echo "   📹 Downloading video (format: bv[height<=$val]+(ba[format_note*=original]/ba))"
              # Use format-sort for better quality selection including 2K
              if yt-dlp $COOKIE_ARGS $EXTRACTOR_ARGS \
                -f "bv[height<=$val]+(ba[format_note*=original]/ba)" \
                --format-sort "res:$val" \
                --js-runtimes deno --remote-components ejs:npm --no-progress \
                -o "$OUTPUT_FOLDER/%(title)s-${val}p.%(ext)s" "$link"; then
                echo "   ✅ Video download success"
              else
                echo "   ❌ Primary download failed – queued for fallback"
                FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [{link: \"$link\", type: \"$type\", val: \"$val\"}]")
              fi
            fi
          done
          
          FAILED_ENTRIES_JSON=$(echo "$FAILED_ENTRIES" | jq -c .)
          echo "FAILED_ENTRIES_JSON=$FAILED_ENTRIES_JSON" >> $GITHUB_OUTPUT
          echo "📊 Primary phase done. Failures: $(echo "$FAILED_ENTRIES" | jq length)"

      # ── Fallback pipelines (all strategies) ──
      - name: '🔄 Fallback pipelines'
        if: steps.primary_download.outputs.FAILED_ENTRIES_JSON != '[]'
        run: |
          set -e
          FAILED_ENTRIES='${{ steps.primary_download.outputs.FAILED_ENTRIES_JSON }}'
          count=$(echo "$FAILED_ENTRIES" | jq length)
          echo "🔄 Attempting fallback for $count failed entries..."
          OUTPUT_FOLDER="youtube"
          
          # Helper for filename suffix
          build_suffix() {
            local type="$1"
            local val="$2"
            if [ "$type" = "a" ]; then
              echo "${val}kbps"
            else
              echo "${val}p"
            fi
          }
          
          # Updated valid qualities including 2K
          # Helper for filename suffix
          build_suffix() {
            local type="$1"
            local val="$2"
            if [ "$type" = "a" ]; then
              echo "${val}kbps"
            else
              echo "${val}p"
            fi
          }
          
          # ── Fallback 0: Piped API (supports 2K) ──
          fallback_piped() {
            echo "[fallback] Piped API"
            local url="$1"
            local type="$2"
            local val="$3"
          
            local vid
            vid=$(echo "$url" | sed -n 's/.*v=\([a-zA-Z0-9_-]\{11\}\).*/\1/p' | head -1)
            if [ -z "$vid" ]; then
              echo "❌ Piped: could not extract video ID"
              return 1
            fi
            echo "   🔑 Video ID: $vid"
          
            local instances=(
              "https://pipedapi.kavin.rocks"
              "https://pipedapi-libre.kavin.rocks"
              "https://pipedapi.adminforge.de"
              "https://pipedapi.syncpundit.com"
            )
          
            local info=""
            local api_base=""
            for inst in "${instances[@]}"; do
              echo "   🌐 Trying instance: $inst"
              info=$(curl -s --max-time 15 "${inst}/streams/${vid}" 2>/dev/null)
              if echo "$info" | jq -e '.videoStreams | length > 0' >/dev/null 2>&1; then
                api_base="$inst"
                echo "   ✅ Instance $inst responded"
                break
              fi
            done
          
            if [ -z "$api_base" ]; then
              echo "❌ Piped: all instances failed"
              return 1
            fi
          
            local title
            title=$(echo "$info" | jq -r '.title // "video"')
            local safe_title
            safe_title=$(echo "$title" | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/__*/_/g' | head -c 100)
            local suffix=$(build_suffix "$type" "$val")
          
            if [ "$type" = "a" ]; then
              echo "   🎵 Audio mode"
              local audio_url
              audio_url=$(echo "$info" | jq -r '.audioStreams | sort_by(-.bitrate) | .[0].url // ""')
              if [ -z "$audio_url" ] || [ "$audio_url" = "null" ]; then
                echo "❌ Piped: no audio stream"
                return 1
              fi
              local filename="${safe_title}-${suffix}.m4a"
              curl -L --fail --progress-bar --retry 3 -o "${OUTPUT_FOLDER}/${filename}" "$audio_url"
              if [ ! -s "${OUTPUT_FOLDER}/${filename}" ]; then
                return 1
              fi
              echo "   ✅ Piped audio success"
            else
              echo "   📹 Video mode (target: ≤ ${val}p)"
              # Find best video stream up to target quality
              local video_url
              video_url=$(echo "$info" | jq -r --argjson maxh "$val" \
                '.videoStreams | map(select(.videoOnly == true and .height <= $maxh)) | sort_by(-.height) | .[0].url // ""')
              
              # If no video-only stream, fall back to regular video streams
              if [ -z "$video_url" ] || [ "$video_url" = "null" ]; then
                video_url=$(echo "$info" | jq -r --argjson maxh "$val" \
                  '.videoStreams | map(select(.height <= $maxh)) | sort_by(-.height) | .[0].url // ""')
              fi
          
              local audio_url
              audio_url=$(echo "$info" | jq -r '.audioStreams | sort_by(-.bitrate) | .[0].url // ""')
          
              if [ -z "$video_url" ] || [ "$video_url" = "null" ]; then
                echo "❌ Piped: no video stream"
                return 1
              fi
              if [ -z "$audio_url" ] || [ "$audio_url" = "null" ]; then
                echo "❌ Piped: no audio stream"
                return 1
              fi
          
              local filename="${safe_title}-${suffix}.mp4"
              local tmp_video="${OUTPUT_FOLDER}/.tmp_${vid}_video"
              local tmp_audio="${OUTPUT_FOLDER}/.tmp_${vid}_audio"
          
              curl -L --fail --progress-bar --retry 3 -o "$tmp_video" "$video_url" || return 1
              curl -L --fail --progress-bar --retry 3 -o "$tmp_audio" "$audio_url" || { rm -f "$tmp_video"; return 1; }
          
              ffmpeg -y -v quiet -i "$tmp_video" -i "$tmp_audio" -c copy "${OUTPUT_FOLDER}/${filename}" 2>/dev/null
              local mux_ok=$?
              rm -f "$tmp_video" "$tmp_audio"
          
              if [ $mux_ok -ne 0 ] || [ ! -s "${OUTPUT_FOLDER}/${filename}" ]; then
                return 1
              fi
              echo "   ✅ Piped video success"
            fi
          }
          
          # ── Fallback 1: yt-dlp with PO Token ──
          fallback_po_token() {
            echo "[fallback] yt-dlp with PO Token"
            local suf=$(build_suffix "$2" "$3")
            local fmt
            if [ "$2" = "a" ]; then
              fmt="ba[format_note*=original]/ba"
            else
              fmt="bv[height<=$3]+(ba[format_note*=original]/ba)"
            fi
            yt-dlp \
              --extractor-args "youtube:player_client=web_music,web,tv" \
              --js-runtimes deno --newline --concurrent-fragments 4 \
              $COOKIE_ARGS \
              -f "$fmt" \
              --format-sort "res:$3" \
              -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          
          # ── Fallback 2: yt-dlp with forced IPv4 ──
          fallback_force_ipv4() {
            echo "[fallback] yt-dlp forced IPv4"
            local suf=$(build_suffix "$2" "$3")
            local fmt
            if [ "$2" = "a" ]; then
              fmt="ba[format_note*=original]/ba"
            else
              fmt="bv[height<=$3]+(ba[format_note*=original]/ba)"
            fi
            yt-dlp --force-ipv4 --retries 10 --fragment-retries 10 \
              --cookies youtube-cookies.txt \
              --extractor-args "youtube:player_client=default,web_embedded" \
              -f "$fmt" \
              --js-runtimes deno --remote-components ejs:npm --no-progress \
              -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          
          # ── Fallback 3: ytmp3.gg API (with 2K support) ──
          fallback_ytmp3_api() {
            echo "[fallback] ytmp3.gg API"
            local type="$2"
            local val="$3"
            FORMAT="mp4"
            QUALITY="${val}p"
            if [ "$type" = "a" ]; then
              FORMAT="mp3"
              QUALITY="${val}kbps"
            fi
          
            local tmp_info
            tmp_info=$(mktemp)
            export TMP_INFO="$tmp_info"
            export FB_URL="$1"
            export FB_FMT="$FORMAT"
            export FB_QUAL="$QUALITY"
          
            python -u << 'PYEOF'
          import os, sys, time, re, requests, json
          URL = os.environ.get('FB_URL')
          FMT = os.environ.get('FB_FMT')
          QUAL = os.environ.get('FB_QUAL')
          TMP_INFO = os.environ.get('TMP_INFO')
          is_audio = FMT == 'mp3'
          
          # Accept all common YouTube qualities including 1440p
          VALID_VIDEO_QUAL = ('360p','480p','720p','1080p','1440p','2160p','4320p')
          VALID_AUDIO_QUAL = ('64kbps','128kbps','192kbps','320kbps')
          
          if is_audio:
              QUAL = QUAL if QUAL in VALID_AUDIO_QUAL else '192kbps'
          else:
              QUAL = QUAL if QUAL in VALID_VIDEO_QUAL else '1080p'
          
          payload = {
              "url": URL,
              "os": "linux",
              "output": {
                  "type": "audio" if is_audio else "video",
                  "format": FMT
              }
          }
          if is_audio:
              payload["audio"] = {"bitrate": QUAL}
          else:
              payload["output"]["quality"] = QUAL
          
          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Origin": "https://ytmp3.gg",
              "Referer": "https://ytmp3.gg/"
          })
          
          try:
              s.get("https://ytmp3.gg/", timeout=15)
          except Exception:
              pass
          
          try:
              resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
              resp.raise_for_status()
          except Exception as e:
              sys.exit(1)
          
          data = resp.json()
          status_url = data.get('statusUrl')
          title = data.get('title', 'video')
          dl_url = None
          
          for _ in range(150):
              time.sleep(2)
              try:
                  r = s.get(status_url, timeout=20)
                  status = r.json()
                  if status.get('status') == 'completed':
                      dl_url = status.get('downloadUrl')
                      break
                  if status.get('status') == 'failed':
                      sys.exit(1)
              except Exception:
                  continue
          
          if not dl_url:
              sys.exit(1)
          
          vid = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', URL)[1]
          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ', '_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:70] or vid
          fname = f"{clean}_{vid}_{QUAL}.{FMT}"
          
          with open(TMP_INFO, "w", encoding="utf-8") as f:
              json.dump({"url": dl_url, "filename": fname}, f)
          PYEOF
          
            if [ ! -s "$tmp_info" ]; then
              rm -f "$tmp_info"
              return 1
            fi
          
            DL_URL=$(python3 -c "import json; print(json.load(open('$tmp_info'))['url'])")
            FILENAME=$(python3 -c "import json; print(json.load(open('$tmp_info'))['filename'])")
          
            curl -L --fail --progress-bar --retry 3 -o "$OUTPUT_FOLDER/$FILENAME" "$DL_URL"
            rm -f "$tmp_info"
          
            if [ ! -s "$OUTPUT_FOLDER/$FILENAME" ]; then
              return 1
            fi
            echo "   ✅ ytmp3.gg success"
          }
          
          # ── Fallback 4: Advanced yt-dlp ──
          fallback_ytdlp_advanced() {
            echo "[fallback] yt-dlp advanced"
            local suf=$(build_suffix "$2" "$3")
            local fmt
            if [ "$2" = "a" ]; then
              fmt="ba[format_note*=original]/ba"
            else
              fmt="bv[height<=$3]+(ba[format_note*=original]/ba)"
            fi
            yt-dlp \
              --extractor-args "youtube:player_client=web_music,web,tv,web_embedded" \
              -f "$fmt" \
              --js-runtimes deno --newline --concurrent-fragments 4 \
              $COOKIE_ARGS \
              --format-sort "res:$3" \
              -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          
          FALLBACKS=(
            fallback_piped
            fallback_po_token
            fallback_force_ipv4
            fallback_ytmp3_api
            fallback_ytdlp_advanced
          )
          
          for ((idx=0; idx<count; idx++)); do
            link=$(echo "$FAILED_ENTRIES" | jq -r ".[$idx].link")
            type=$(echo "$FAILED_ENTRIES" | jq -r ".[$idx].type")
            val=$(echo "$FAILED_ENTRIES" | jq -r ".[$idx].val")
            echo "========================================"
            echo "🔄 Fallback for: $link ($type $val)"
            succeeded=false
            for fb in "${FALLBACKS[@]}"; do
              if $fb "$link" "$type" "$val"; then
                echo "   ✅ Fallback '$fb' succeeded"
                succeeded=true
                break
              else
                echo "   ❌ Fallback '$fb' failed"
              fi
            done
            if [ "$succeeded" = false ]; then
              echo "❌ All fallbacks exhausted for $link"
            fi
          done
        env:
          COOKIE_ARGS: ${{ (secrets.YOUTUBE_COOKIES && '--cookies youtube-cookies.txt') || '' }}

      # ── Verify & Rename Downloads ──
      - name: '🗂️ Verify & Rename Downloads'
        id: verify
        run: |
          set -e
          OUTPUT_FOLDER="youtube"
          THRESH_MB=99
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))

          if [ ! -d "$OUTPUT_FOLDER" ] || [ -z "$(ls -A "$OUTPUT_FOLDER" 2>/dev/null)" ]; then
            echo "❌ ERROR: '$OUTPUT_FOLDER' folder is missing or empty – nothing to commit."
            exit 1
          fi

          echo "📂 Initial contents of '$OUTPUT_FOLDER':"
          ls -lah "$OUTPUT_FOLDER"

          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            fs=$(stat -c%s "$f")
            fname=$(basename "$f")
            if [ "$fs" -gt "$THRESH_BYTES" ]; then
              echo "   ✂️  Splitting $fname ($((fs/1024/1024)) MB) into ${THRESH_MB}MB parts"
              zip -j -s "${THRESH_MB}m" "$OUTPUT_FOLDER/${fname}.zip" "$f"
              rm "$f"
            fi
          done

          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            dir=$(dirname "$f")
            base=$(basename "$f")
            newbase=$(echo "$base" | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/__*/_/g')
            if [ "$base" != "$newbase" ]; then
              echo "   ✏️  Renaming: $base → $newbase"
              mv -v "$f" "$dir/$newbase"
            fi
          done

          echo "✅ Verification & processing complete."
          echo "::set-output name=file_count::$(ls -1 "$OUTPUT_FOLDER" | wc -l)"

      # ── Atomic Commit & Push ──
      - name: '📤 Commit & Push Changes'
        run: |
          set -e
          OUTPUT_FOLDER="youtube"
          FILE_COUNT="${{ steps.verify.outputs.file_count }}"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ No files to commit – aborting push."
            exit 1
          fi

          echo "🚀 Preparing to commit $FILE_COUNT file(s) from '$OUTPUT_FOLDER'..."

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          git add "$OUTPUT_FOLDER/"

          if git diff --cached --quiet; then
            echo "⚠️  No changes staged – nothing to commit."
            exit 1
          fi

          git diff --cached --stat

          git commit -m "⬇️ YouTube download [skip ci]"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "🚀 Push attempt $i..."
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            if git push origin "${{ github.ref_name }}"; then
              echo "✅ Push succeeded"
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "⏳ Push rejected, retrying in 3s..."
                sleep 3
              else
                echo "❌ Push failed after $RETRIES attempts"
                exit 1
              fi
            fi
          done

      # ── Cleanup ──
      - name: '🧹 Cleanup'
        if: always()
        run: |
          rm -rf .download_info youtube-cookies.txt 2>/dev/null || true
          pkill -f "main.js" 2>/dev/null || true
          echo "✅ Cleanup done."
