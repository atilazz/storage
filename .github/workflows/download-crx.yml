name: Download Chrome Extension (CRX)

on:
  workflow_dispatch:
    inputs:
      extension_id:
        description: 'Extension ID from Chrome Web Store URL'
        required: true
        type: string
        default: 'gcknhkkoolaabfmlnjonogaaifnjlfnp'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Set filename
        id: vars
        run: |
          EXT_ID="${{ github.event.inputs.extension_id }}"
          DOWNLOAD_URL="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=100&acceptformat=crx2,crx3&x=id%3D${EXT_ID}%26uc"
          echo "download_url=${DOWNLOAD_URL}" >> $GITHUB_OUTPUT
          echo "filename=foxyproxy-${EXT_ID}.crx" >> $GITHUB_OUTPUT

      - name: ⬇️ Download .crx file
        run: |
          curl -L -o "${{ steps.vars.outputs.filename }}" "${{ steps.vars.outputs.download_url }}"
          echo "✅ Downloaded: ${{ steps.vars.outputs.filename }}"

      - name: 📤 Upload to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.vars.outputs.filename }}"
          git commit -m "Add ${{ steps.vars.outputs.filename }} [skip ci]" || echo "No changes to commit"
          git push
